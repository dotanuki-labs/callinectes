name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-26.04

    steps:
      - name: Project Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Bash Scripts
        uses: dotanuki-labs/github-actions/quality/bash@a7a632c1f8edc37e8d49b916363dba064e72e893

      - name: Install hawkeye
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: hawkeye

      - name: Check MIT license on source files
        run: hawkeye check

      - name: Run Component Tests
        run: ./component-tests.sh
